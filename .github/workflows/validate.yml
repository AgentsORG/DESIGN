name: design
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install pyyaml jsonschema
      - name: Validate design.v1.schema.json parses
        run: python -c "import json; json.load(open('schema/design.v1.schema.json')); print('schema ok')"
      - name: Validate examples against schema + lint rules
        run: python scripts/lint_design.py
      - name: Core files exist
        run: |
          test -f SPEC.md
          test -f skills/design/SKILL.md
          test -f docs/INDEX.md
          echo core files ok
      - name: Guard against private-source mentions
        run: |
          if git grep -I -i -n -E "aiforui|kowalski|animations\.dev|emilkowal|antalik|easings?\.(dev|co)|index\.how" -- ':!.github/workflows/validate.yml'; then
            echo "::error::banned reference found in tracked files"
            exit 1
          fi
          echo leak guard ok
